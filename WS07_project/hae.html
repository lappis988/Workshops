    <meta charset="utf-8" />

    <link rel="icon" type="image/x-icon" href="images/wiltsu.PNG">
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
     <style>
    body {
      background: url(images/haku-bg.jpg) no-repeat center center fixed;
      background-size: cover;
    }
  </style>
  </head>
  
  <body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-sm fixed-top bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="./index.html">
          <img
            src="images/wiltsu.PNG"
            alt="Logo"
            width="40"
            height="40"
            class="d-inline-block align-text-center"
          />
          Wiltsu Fitness
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse justify-content-lg-center navbar-collapse"
          id="navbarNavAltMarkup"
        >
          <ul class="nav nav-underline">
            <li class="nav-item">
              <a class="nav-link" href="./index.html">Etusivu</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./minuntarina.html">Minun tarina</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./UKK.html">UKK</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./hae.html">Hae mukaan!</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- header -->
    
    <!-- Hae mukaan -->
    <section id="apply" class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-6 col-md-8">

            <div class="feedback-container my-5 rounded-4 px-5 py-4">
              <div class="feedback-header text-center mt-1 mb-3">
                <h1 class="sr-only">Hae</h1>
                <h2 class="fw-bold">Hae mukaan valmennukseen!</h2>
                <p>Täytä alla olevat kentät, niin päästään vauhtiin.</p>
              </div>

              <form>

                <div class="mb-3">
                  <label for="tavoite" class="form-label fw-medium">Miten voimme auttaa?</label>
                  <select class="form-select" name="help" id="tavoite">
                    <option selected disabled>Valitse...</option>
                    <option value="">Rasvanpoltto/Kiinteytyminen</option>
                    <option value="">Lihasmassan kasvatus</option>
                    <option value="">Painonpudotus/Elämäntapamuutos</option>
                    <option value="">Muu</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="sukupuoli" class="form-label fw-medium">Miten määrittelet sukupuolesi?</label>
                  <select class="form-select" name="help" id="sukupuoli">
                    <option selected disabled>Valitse...</option>
                    <option value="">Nainen</option>
                    <option value="">Mies</option>
                    <option value="">Muu</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="ika" class="form-label fw-medium">Ikä</label>
                  <select class="form-select" name="help" id="ika">
                    <option selected disabled>Valitse...</option>
                    <option value="">16-17</option>
                    <option value="">18-30</option>
                    <option value="">31-50</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="kerro-itsestä" class="form-label fw-medium">Kerro lyhyesti itsestäsi ja tavoitteestasi</label>
                  <textarea name="comments" class="form-control rounded-3" id="kerro-itsestä" rows="2" required placeholder="Pääset myöhemmin kertomaan enemmän itsestäsi"></textarea>
                </div>

                <div class="mb-3">
                  <label for="toive" class="form-label fw-medium">Jos päädymme yhteistyöhön, milloin toivoisit valmennuksen alkavan?</label>
                  <textarea name="comments" class="form-control rounded-3" id="toive" rows="2" required placeholder="Pyrimme aloittamaan maanantaisin"></textarea>
                </div>

                <p class="fw-bold text-center mb-0">Yhteystiedot</p>

                <div class="mb-0">
                  <label for="name" class="form-label fw-medium"></label>
                  <input type="text" class="form-control rounded-3" name="name" required placeholder="Koko nimesi" id="name">
                </div>

                <div class="mb-3 mt-0">
                  <label for="email" class="form-label fw-medium"></label>
                  <input type="email" class="form-control rounded-3" name="email" required placeholder="Sähköpostisi" id="email">
                </div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-submit btn-light btn-md border-1 fw-bold">Ota minuun yhteyttä</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- footer -->
    <footer class="footer bg-dark text-white py-3 text-center fixed-bottom">
      <p class="mb-0">&copy; 2026 WiltsuFitness. All rights reserved.</p>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

      crossorigin="anonymous"
    ></script>
  </body>
</html>
